name: Unified App Quality

on:
  push:
    branches: [main]
    paths:
      - 'unified-app/**'
      - '.github/workflows/unified-app-quality.yml'
  pull_request:
    paths:
      - 'unified-app/**'
      - '.github/workflows/unified-app-quality.yml'

permissions:
  contents: read

concurrency:
  group: unified-app-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unified-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: unified-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check P2 coverage
        continue-on-error: true
        run: node --test src/data/assessmentP2Coverage.test.mjs

      - name: Check scenario extensions
        continue-on-error: true
        run: node --test src/data/assessmentScenarioExtensions.test.mjs

      - name: Check visual-state integration
        continue-on-error: true
        run: node --test src/data/assessmentVisualState.test.mjs

      - name: Check shared assessment contract
        continue-on-error: true
        run: node --test src/data/assessmentQuality.test.mjs

      - name: Check P0 coverage
        continue-on-error: true
        run: node --test src/data/assessmentP0Coverage.test.mjs

      - name: Check Probability Distributions assessment
        continue-on-error: true
        run: node --test src/data/probabilityDistributionsAssessment.test.mjs

      - name: Check classical ML and statistics depth
        continue-on-error: true
        run: node --test src/data/classicalMlStatisticsCoverage.test.mjs

      - name: Check linear algebra depth
        continue-on-error: true
        run: node --test src/data/linearAlgebraCoverage.test.mjs

      - name: Check numerical linear algebra depth
        continue-on-error: true
        run: node --test src/data/numericalLinearAlgebraCoverage.test.mjs

      - name: Check information theory depth
        continue-on-error: true
        run: node --test src/data/informationTheoryCoverage.test.mjs

      - name: Check Bloom filter depth
        continue-on-error: true
        run: node --test src/data/bloomFilterCoverage.test.mjs

      - name: Check neural network depth
        continue-on-error: true
        run: node --test src/data/neuralNetworkCoverage.test.mjs

      - name: Check NLP and transformer depth
        continue-on-error: true
        run: node --test src/data/nlpTransformerCoverage.test.mjs

      - name: Check generative AI and RL depth
        continue-on-error: true
        run: node --test src/data/generativeRlCoverage.test.mjs

      - name: Check RAG depth
        continue-on-error: true
        run: node --test src/data/ragCoverage.test.mjs

      - name: Check production ML depth
        continue-on-error: true
        run: node --test src/data/productionMlCoverage.test.mjs

      - name: Check frontier systems depth
        continue-on-error: true
        run: node --test src/data/frontierSystemsCoverage.test.mjs

      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-output
          path: unified-app/test-output.log
          if-no-files-found: ignore

      - name: Generate curriculum audit
        run: npm run audit:quality

      - name: Build application
        run: npm run build
